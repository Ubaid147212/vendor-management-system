<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendorPro — Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ===== ANIMATED BACKGROUND ===== */
    .bg-animation {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      overflow: hidden;
    }

    .bg-animation::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center,
        rgba(255, 100, 0, 0.15) 0%,
        rgba(255, 60, 0, 0.08) 30%,
        transparent 70%
      );
      animation: rotateBg 8s linear infinite;
    }

    @keyframes rotateBg {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: floatOrb 6s ease-in-out infinite;
    }

    .orb1 {
      width: 400px; height: 400px;
      background: rgba(255, 100, 0, 0.25);
      top: -100px; left: -100px;
      animation-delay: 0s;
    }

    .orb2 {
      width: 300px; height: 300px;
      background: rgba(255, 150, 0, 0.2);
      bottom: -80px; right: -80px;
      animation-delay: 2s;
    }

    .orb3 {
      width: 200px; height: 200px;
      background: rgba(255, 50, 0, 0.15);
      top: 50%; left: 50%;
      animation-delay: 4s;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-30px) scale(1.1); }
    }

    /* ===== FLOATING PARTICLES ===== */
    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    .particle {
      position: absolute;
      width: 4px; height: 4px;
      background: rgba(255, 120, 0, 0.6);
      border-radius: 50%;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
    }

    /* ===== GRID LINES ===== */
    .grid {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      background-image:
        linear-gradient(rgba(255,100,0,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,100,0,0.05) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    /* ===== MAIN CARD ===== */
    .login-wrapper {
      position: relative;
      z-index: 10;
      perspective: 1000px;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 120, 0, 0.2);
      border-radius: 24px;
      padding: 50px 45px;
      width: 440px;
      max-width: 95vw;
      box-shadow:
        0 0 0 1px rgba(255,120,0,0.1),
        0 20px 60px rgba(0,0,0,0.5),
        0 0 100px rgba(255,100,0,0.1),
        inset 0 1px 0 rgba(255,255,255,0.1);
      transform-style: preserve-3d;
      animation: cardFloat 4s ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px) rotateX(0deg); }
      50% { transform: translateY(-8px) rotateX(1deg); }
    }

    .card-glow {
      position: absolute;
      top: 0; left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg,
        transparent,
        rgba(255,120,0,0.8),
        rgba(255,200,0,1),
        rgba(255,120,0,0.8),
        transparent
      );
      animation: glowScan 3s ease-in-out infinite;
    }

    @keyframes glowScan {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    /* ===== LOGO SECTION ===== */
    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 15px;
    }

    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #ff6400, #ff9500, #ffb700);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto;
      box-shadow:
        0 10px 30px rgba(255,100,0,0.4),
        0 0 60px rgba(255,100,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.3);
      transform: rotate(-5deg);
      animation: iconPulse 2s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    @keyframes iconPulse {
      0%, 100% { transform: rotate(-5deg) scale(1); box-shadow: 0 10px 30px rgba(255,100,0,0.4), 0 0 60px rgba(255,100,0,0.2); }
      50% { transform: rotate(-5deg) scale(1.05); box-shadow: 0 15px 40px rgba(255,100,0,0.6), 0 0 80px rgba(255,100,0,0.3); }
    }

    .logo-ring {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 100px; height: 100px;
      border: 2px solid rgba(255,120,0,0.3);
      border-radius: 50%;
      animation: ringPulse 2s ease-in-out infinite;
    }

    .logo-ring2 {
      width: 120px; height: 120px;
      border-color: rgba(255,120,0,0.15);
      animation-delay: 0.5s;
    }

    @keyframes ringPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    }

    .logo-title {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff6400, #ffb700, #ff6400);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3s linear infinite;
      letter-spacing: -0.5px;
    }

    @keyframes shimmer {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .logo-subtitle {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      font-weight: 400;
      margin-top: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ===== FORM ELEMENTS ===== */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,150,0,0.8);
      margin-bottom: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      z-index: 2;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px 14px 45px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,120,0,0.2);
      border-radius: 12px;
      font-size: 14px;
      color: white;
      outline: none;
      transition: all 0.3s ease;
      font-family: 'Poppins', sans-serif;
    }

    .form-group input::placeholder {
      color: rgba(255,255,255,0.2);
    }

    .form-group input:focus {
      background: rgba(255,120,0,0.08);
      border-color: rgba(255,120,0,0.6);
      box-shadow:
        0 0 0 3px rgba(255,100,0,0.1),
        0 0 20px rgba(255,100,0,0.1);
    }

    .input-focus-line {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: linear-gradient(90deg, #ff6400, #ffb700);
      border-radius: 0 0 12px 12px;
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .form-group input:focus ~ .input-focus-line {
      width: 100%;
    }

    /* ===== LOGIN BUTTON ===== */
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff6400 0%, #ff9500 50%, #ffb700 100%);
      background-size: 200%;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 8px 25px rgba(255,100,0,0.4),
        0 0 50px rgba(255,100,0,0.1);
      animation: btnGradient 3s ease infinite;
    }

    @keyframes btnGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .login-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.5s ease;
    }

    .login-btn:hover::before {
      left: 100%;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        0 15px 35px rgba(255,100,0,0.5),
        0 0 60px rgba(255,100,0,0.2);
    }

    .login-btn:active {
      transform: translateY(0px);
    }

    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* ===== MESSAGES ===== */
    .message-box {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      text-align: center;
      font-weight: 500;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .error-box {
      background: rgba(255,50,50,0.1);
      border: 1px solid rgba(255,50,50,0.3);
      color: #ff6b6b;
    }

    .loading-box {
      background: rgba(255,120,0,0.1);
      border: 1px solid rgba(255,120,0,0.3);
      color: #ffaa44;
    }

    /* ===== ROLE BADGES ===== */
    .divider {
      display: flex;
      align-items: center;
      margin: 25px 0 20px;
      gap: 10px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(255,120,0,0.15);
    }

    .divider-text {
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .role-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid;
      transition: all 0.3s ease;
      cursor: default;
    }

    .badge:hover {
      transform: translateY(-2px);
    }

    .badge-admin {
      background: rgba(255,180,0,0.1);
      border-color: rgba(255,180,0,0.3);
      color: #ffcc44;
    }

    .badge-manager {
      background: rgba(200,200,200,0.1);
      border-color: rgba(200,200,200,0.3);
      color: #cccccc;
    }

    .badge-vendor {
      background: rgba(0,255,120,0.08);
      border-color: rgba(0,255,120,0.2);
      color: #44ffaa;
    }

    .badge-worker {
      background: rgba(0,150,255,0.08);
      border-color: rgba(0,150,255,0.2);
      color: #44aaff;
    }

    .badge-delivery {
      background: rgba(255,100,0,0.1);
      border-color: rgba(255,100,0,0.3);
      color: #ff8844;
    }

    .footer-text {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: rgba(255,255,255,0.15);
      letter-spacing: 1px;
    }

    /* ===== CORNER DECORATIONS ===== */
    .corner {
      position: absolute;
      width: 20px; height: 20px;
      border-color: rgba(255,120,0,0.4);
      border-style: solid;
    }

    .corner-tl {
      top: 15px; left: 15px;
      border-width: 2px 0 0 2px;
      border-radius: 4px 0 0 0;
    }

    .corner-tr {
      top: 15px; right: 15px;
      border-width: 2px 2px 0 0;
      border-radius: 0 4px 0 0;
    }

    .corner-bl {
      bottom: 15px; left: 15px;
      border-width: 0 0 2px 2px;
      border-radius: 0 0 0 4px;
    }

    .corner-br {
      bottom: 15px; right: 15px;
      border-width: 0 2px 2px 0;
      border-radius: 0 0 4px 0;
    }
  </style>
</head>
<body>

  <!-- Background Effects -->
  <div class="bg-animation">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
  </div>
  <div class="grid"></div>
  <div class="particles" id="particles"></div>

  <!-- Login Card -->
  <div class="login-wrapper">
    <div class="login-card" id="loginCard">

      <!-- Corner Decorations -->
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <!-- Top Glow Line -->
      <div class="card-glow"></div>

      <!-- Logo -->
      <div class="logo-section">
        <div class="logo-icon-wrapper">
          <div class="logo-ring"></div>
          <div class="logo-ring logo-ring2"></div>
          <div class="logo-icon">🏪</div>
        </div>
        <div class="logo-title">VendorPro</div>
        <div class="logo-subtitle">Daraz Multi-Vendor System • Vehari</div>
      </div>

      <!-- Messages -->
      <div class="message-box error-box" id="errorMsg"></div>
      <div class="message-box loading-box" id="loadingMsg"></div>

      <!-- Form -->
      <div class="form-group">
        <label>📧 Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input
            type="email"
            id="emailInput"
            placeholder="Enter your email address"
            autocomplete="email"
          />
          <div class="input-focus-line"></div>
        </div>
      </div>

      <div class="form-group">
        <label>🔑 Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input
            type="password"
            id="passwordInput"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <div class="input-focus-line"></div>
        </div>
      </div>

      <button class="login-btn" id="loginBtn" onclick="handleLogin()">
        🚀 Login to Dashboard
      </button>

      <!-- Role Badges -->
      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">Roles</div>
        <div class="divider-line"></div>
      </div>

      <div class="role-badges">
        <span class="badge badge-admin">👑 Admin</span>
        <span class="badge badge-manager">🔍 Manager</span>
        <span class="badge badge-vendor">🏬 Vendor</span>
        <span class="badge badge-worker">🎨 Worker</span>
        <span class="badge badge-delivery">🚴 Delivery</span>
      </div>

      <div class="footer-text">
        ONE LOGIN • ALL ROLES • AUTO REDIRECT
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

    // ==============================
    // YOUR SUPABASE DETAILS
    // ==============================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    // ==============================

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ===== CREATE FLOATING PARTICLES =====
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.classList.add('particle');
        p.style.left = Math.random() * 100 + 'vw';
        p.style.width = p.style.height = (Math.random() * 4 + 2) + 'px';
        p.style.animationDuration = (Math.random() * 10 + 8) + 's';
        p.style.animationDelay = (Math.random() * 10) + 's';
        p.style.opacity = Math.random() * 0.6 + 0.2;
        container.appendChild(p);
      }
    }
    createParticles();

    // ===== 3D CARD MOUSE EFFECT =====
    const card = document.getElementById('loginCard');
    document.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rotateX = (e.clientY - centerY) / 30;
      const rotateY = (centerX - e.clientX) / 30;
      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-8px)`;
    });

    document.addEventListener('mouseleave', () => {
      card.style.transform = 'rotateX(0deg) rotateY(0deg) translateY(0px)';
    });

    // ===== LOGIN FUNCTION =====
    async function handleLogin() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const loadingMsg = document.getElementById('loadingMsg');
      const loginBtn = document.getElementById('loginBtn');

      errorMsg.style.display = 'none';
      loadingMsg.style.display = 'none';

      if (!email || !password) {
        errorMsg.textContent = '⚠️ Please enter both email and password.';
        errorMsg.style.display = 'block';
        return;
      }

      loadingMsg.textContent = '⏳ Verifying credentials...';
      loadingMsg.style.display = 'block';
      loginBtn.disabled = true;
      loginBtn.textContent = '⏳ Logging in...';

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw new Error('Invalid email or password. Please try again.');

        const { data: profile, error: profileError } = await supabaseClient
          .from('profiles')
          .select('role, full_name, is_online')
          .eq('id', data.user.id)
          .single();

        if (profileError || !profile) {
          throw new Error('Account setup incomplete. Please contact Admin.');
        }

        if (profile.is_online === false) {
          throw new Error('Your account is marked Offline today. Contact Admin or Manager.');
        }

        loadingMsg.textContent = `✅ Welcome ${profile.full_name}! Redirecting to your dashboard...`;

        setTimeout(() => {
          switch(profile.role) {
            case 'admin':
              window.location.href = 'admin/dashboard.html';
              break;
            case 'manager':
              window.location.href = 'manager/dashboard.html';
              break;
            case 'vendor':
              window.location.href = 'vendor/dashboard.html';
              break;
            case 'worker':
              window.location.href = 'worker/dashboard.html';
              break;
            case 'delivery':
              window.location.href = 'delivery/dashboard.html';
              break;
            default:
              throw new Error('Unknown role. Contact Admin.');
          }
        }, 1500);

      } catch (err) {
        loadingMsg.style.display = 'none';
        errorMsg.textContent = '❌ ' + err.message;
        errorMsg.style.display = 'block';
        loginBtn.disabled = false;
        loginBtn.textContent = '🚀 Login to Dashboard';
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

  </script>
</body>
</html>
