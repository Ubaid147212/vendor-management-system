<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VendorPro — Sign In</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    
    body {
      min-height: 100vh;
      background: #0d0d0f;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .bg-glow {
      position: fixed;
      top: 50%; left: 50%;
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(255,122,26,0.08) 0%, transparent 60%);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 80px;
      max-width: 1000px;
      width: 100%;
      padding: 40px;
    }

    .brand-panel {
      flex: 1;
      display: none;
    }

    @media (min-width: 900px) {
      .brand-panel { display: block; }
    }

    .brand-mark {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #ff7a1a, #ff9d4d);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      box-shadow: 0 8px 24px rgba(255,122,26,0.35);
    }

    .brand-panel h1 {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    .brand-panel h1 span { color: #ff7a1a; }

    .brand-panel p {
      font-size: 15px;
      color: rgba(255,255,255,0.45);
      line-height: 1.7;
      max-width: 380px;
    }

    .login-wrapper {
      flex: 1;
      max-width: 400px;
      width: 100%;
    }

    .login-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 44px 36px;
      box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
      transition: transform 0.2s ease;
    }

    .card-header h2 {
      font-size: 24px;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
    }

    .card-header p {
      color: rgba(255,255,255,0.4);
      font-size: 14px;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #ff9d4d;
      margin-bottom: 8px;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      width: 100%;
      padding: 14px 16px 14px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: white;
      font-size: 15px;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #888;
      cursor: pointer;
      font-size: 18px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #ff7a1a;
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 25px rgba(255,122,26,0.3);
    }

    .login-btn:hover {
      background: #ff8c38;
      transform: translateY(-1px);
    }

    .error-box {
      background: rgba(255, 60, 60, 0.1);
      border: 1px solid rgba(255,60,60,0.3);
      color: #ff6666;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .footer-note {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="container">
    <!-- Brand Side -->
    <div class="brand-panel">
      <div class="brand-mark">🏪</div>
      <h1>Manage your entire<br><span>vendor network</span><br>from one place.</h1>
      <p>A unified platform to manage vendors, product editing, delivery, and commission tracking — built for your Daraz operations in Vehari.</p>
    </div>

    <!-- Login Card -->
    <div class="login-wrapper">
      <div class="login-card" id="loginCard">
        <div class="card-header">
          <h2>Welcome back</h2>
          <p>Sign in to access your dashboard</p>
        </div>

        <div class="error-box" id="errorMsg"></div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="emailInput" value="formemyyes@gmail.com" placeholder="you@example.com">
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="password-wrapper">
            <input type="password" id="passwordInput" value="Admin12345" placeholder="Enter password">
            <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
          </div>
        </div>

        <button class="login-btn" onclick="handleLogin()">Sign In</button>

        <div class="footer-note">
          Secured access • One login for all roles
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://faqysbhbqwpndinyxzrh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZhcXlzYmhicXdwbmRpbnl4enJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjAzMzQsImV4cCI6MjEwMjg5NjMzNH0.mMoxhImEeg7BVDVgPogClkelxmAqlhi51BksrjAso7k';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 3D Card Tilt Effect
    const card = document.getElementById('loginCard');
    document.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = `perspective(1000px) rotateX(${y * -8}deg) rotateY(${x * 12}deg)`;
    });
    document.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });

    function togglePassword() {
      const passInput = document.getElementById('passwordInput');
      const toggleBtn = document.querySelector('.toggle-password');
      if (passInput.type === "password") {
        passInput.type = "text";
        toggleBtn.textContent = "🙈";
      } else {
        passInput.type = "password";
        toggleBtn.textContent = "👁️";
      }
    }

    async function handleLogin() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const errorMsg = document.getElementById('errorMsg');

      errorMsg.style.display = 'none';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) throw error;

        // Redirect to Admin Dashboard
        window.location.href = 'admin/dashboard.html';

      } catch (err) {
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Invalid email or password. Please try again.';
      }
    }

    // Allow pressing Enter to login
    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
